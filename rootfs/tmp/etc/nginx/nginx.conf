# Taiga gateway - main nginx configuration
user                                           nginx;
worker_processes                               auto;
daemon                                         off;
error_log                                      /data/logs/nginx/nginx.log warn;
pid                                            /run/nginx/nginx.pid;

events {
    worker_connections                         1024;
}

http {
    include                                    /etc/nginx/mime.types;
    default_type                               application/octet-stream;
    sendfile                                   on;
    keepalive_timeout                          65;
    server_tokens                              off;
    gzip                                       on;
    gzip_types                                 text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    disable_symlinks                           off;
    access_log                                 /data/logs/nginx/access.log;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # keep the protocol reported by an upstream tls terminating proxy, otherwise use the local scheme
    map $http_x_forwarded_proto $taiga_proto { default $http_x_forwarded_proto; '' $scheme; }

    include                                    /etc/nginx/conf.d/*.conf;
}
