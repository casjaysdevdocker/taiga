# Taiga gateway - routes everything to the services running inside this container
#   /          static taiga-front
#   /api/      taiga-back (gunicorn)             127.0.0.1:8000
#   /admin/    taiga-back (gunicorn)             127.0.0.1:8000
#   /static/   collected static files of taiga-back
#   /media/    taiga-protected (signed urls)     127.0.0.1:8003
#   /events    taiga-events (websocket)          127.0.0.1:8888
server {
    listen                                     REPLACE_SERVER_PORT default_server;
    server_name                                _;
    client_max_body_size                       100M;
    charset                                    utf-8;
    root                                       /usr/local/share/taiga/taiga-front;

    location = /_health {
        default_type                           "text/plain";
        access_log                             off;
        return                                 200 'ok';
    }

    # Frontend
    location / {
        index                                  index.html;
        try_files                              $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass                             http://127.0.0.1:8000/api/;
        proxy_pass_header                      Server;
        proxy_set_header Host                  $http_host;
        proxy_redirect                         off;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Scheme              $taiga_proto;
        proxy_set_header X-Forwarded-Proto     $taiga_proto;
        proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
    }

    # Admin
    location /admin/ {
        proxy_pass                             http://127.0.0.1:8000/admin/;
        proxy_pass_header                      Server;
        proxy_set_header Host                  $http_host;
        proxy_redirect                         off;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Scheme              $taiga_proto;
        proxy_set_header X-Forwarded-Proto     $taiga_proto;
        proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
    }

    # Static
    location /static/ {
        alias                                  /usr/local/share/taiga/taiga-back/static/;
    }

    # Protected media - only reachable through an X-Accel-Redirect from taiga-protected
    location /_protected/ {
        internal;
        alias                                  /data/taiga/media/;
        add_header Content-disposition         "attachment";
    }

    # Unprotected section
    location /media/exports/ {
        alias                                  /data/taiga/media/exports/;
        add_header Content-disposition         "attachment";
    }

    location /media/ {
        proxy_set_header Host                  $http_host;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Scheme              $taiga_proto;
        proxy_set_header X-Forwarded-Proto     $taiga_proto;
        proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_pass                             http://127.0.0.1:8003/;
        proxy_redirect                         off;
    }

    # Events
    location /events {
        proxy_pass                             http://127.0.0.1:8888/events;
        proxy_http_version                     1.1;
        proxy_set_header Upgrade               $http_upgrade;
        proxy_set_header Connection            "upgrade";
        proxy_connect_timeout                  7d;
        proxy_send_timeout                     7d;
        proxy_read_timeout                     7d;
    }
}
